<form action="http://localhost:3000/addDoctor" method="POST" enctype="multipart/form-data">

    <input type="text" name="hospitalId" placeholder="Hospital ID" />
    
    <input type="text" name="doctorName" placeholder="Doctor Name" />
    
    <input type="text" name="doctorSkills" placeholder="Skills" />
    
    <input type="text" name="doctorUsername" placeholder="Username" />
    
    <input type="password" name="doctorPassword" placeholder="Password" />
    
    <input type="file" name="doctorPhoto" />
    
    <button type="submit">Add Doctor</button>

</form>
